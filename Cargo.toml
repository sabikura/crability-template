[package]
name = "{{project-name}}"
version = "0.1.0"
edition = "2021"

# The default test harnesses need the `test` crate, which does not exist for the
# purecap target. Integration tests bring their own entry point instead.
[lib]
test = false
doctest = false

[[bin]]
name = "{{project-name}}"
path = "src/main.rs"
test = false

{% if platform != "fvp" -%}
[[test]]
name = "boot"
harness = false

{% endif -%}
{% if platform == "qemu-el1" -%}
# The hybrid feature makes _el1_entry start with an A64 prologue that enables
# capability instructions and switches to C64, so plain -M virt can enter it at EL1
{% endif -%}
[dependencies]
{% if purecap_source == "" -%}
aarch64-purecap-rt = { git = "https://github.com/sabikura/aarch64-purecap.git"{% if platform == "qemu-el1" %}, features = ["hybrid"]{% endif %} }
aarch64-purecap-cpu = { git = "https://github.com/sabikura/aarch64-purecap.git" }
{% else -%}
aarch64-purecap-rt = { path = "{{purecap_source}}/aarch64-purecap-rt"{% if platform == "qemu-el1" %}, features = ["hybrid"]{% endif %} }
aarch64-purecap-cpu = { path = "{{purecap_source}}/aarch64-purecap-cpu" }
{% endif -%}
