[template]
ignore = [".git"]
sub_templates = ["qemu", "fvp"]

# `crability new-project` fills crability_bin from its own config. The default below only
# matters when running cargo-generate by hand.

[placeholders.crability_bin]
type = "string"
prompt = "Directory where crability symlinks the toolchain (rustc, clang, qemu-system-morello)"
default = "$HOME/.crability/bin"
